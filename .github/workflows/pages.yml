name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded pull request builds, but never interrupt an in-flight
# deploy to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Report lint and test failures even when the build already failed, so a
      # pull request surfaces every problem in one run.
      - if: '!cancelled()'
        run: npm run lint
      - if: '!cancelled()'
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run so no manual repo-settings
          # step is needed.
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
